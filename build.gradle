plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

apply from: 'build.allprojects.gradle'

def minecraftVersion = '26.2'
def mappingsVersion = 'official'
def fabricLoaderVersion = '0.19.3'
def fabricApiVersion = '0.156.0+26.2'
def polymerVersion = 'polymer-core:0.17.5+26.2'
project.version = "${project.version}+${minecraftVersion}"

sourceSets {
    main.java.srcDirs = [
            'src/main/java'
    ]
}

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz' }
}

dependencies {
    // Minecraft and fabric
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation files('../MC-Mods/Util-Mods/MC-Portal-Protocol/build/libs/mc-portal-protocol-1.0.0.jar')
    implementation include("eu.pb4:${polymerVersion}") { exclude group: 'net.fabricmc.fabric-api' }

}

processResources {
    var replaceProperties = [
            version  : project.version,
            minecraft: minecraftVersion,
            mappings : mappingsVersion,
            fabric   : fabricLoaderVersion,
            fabricApi: fabricApiVersion
    ]
    inputs.properties replaceProperties
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}
